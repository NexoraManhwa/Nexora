<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXORA MANHWA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }

    header {
      padding: 20px;
      background: #111116;
      border-bottom: 1px solid #292932;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .logo span {
      color: #8b5cf6;
    }

    .search {
      margin-top: 18px;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #30303a;
      background: #191920;
      color: white;
      font-size: 15px;
      outline: none;
    }

    main {
      padding: 20px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #9999a5;
    }

    .section-title {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .card {
      background: #15151c;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #292932;
    }

    .cover {
      width: 100%;
      height: 220px;
      background: linear-gradient(135deg, #242432, #111116);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777785;
      font-size: 13px;
    }

    .info {
      padding: 12px;
    }

    .info h3 {
      font-size: 15px;
      margin-bottom: 6px;
    }

    .info p {
      color: #888895;
      font-size: 12px;
    }

    .bottom {
      margin-top: 30px;
      padding: 20px 0;
      text-align: center;
      color: #666672;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      NEXORA <span>MANHWA</span>
    </div>

    <input
      class="search"
      type="text"
      placeholder="🔎 Pesquisar manhwa..."
    >
  </header>

  <main>

    <div class="welcome">
      <h1>Seu universo de histórias.</h1>
      <p>Leia seus manhwas favoritos em um só lugar.</p>
    </div>

    <h2 class="section-title">🔥 Em destaque</h2>

    <div class="grid">

      <div class="card">
        <div class="cover">
          CAPA
        </div>

        <div class="info">
          <h3>Em breve</h3>
          <p>0 capítulos</p>
        </div>
      </div>

      <div class="card">
        <div class="cover">
          CAPA
        </div>

        <div class="info">
          <h3>Em breve</h3>
          <p>0 capítulos</p>
        </div>
      </div>

    </div>

    <div class="bottom">
      © 2026 NEXORA MANHWA
    </div>

  </main>

</body>
</html>
